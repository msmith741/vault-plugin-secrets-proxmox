name: Temporary dependency graph regeneration
on:
  pull_request:
    paths:
      - ".github/workflows/dependency-upgrade-once.yml"
      - "go.mod"
      - "go.sum"
      - "cmd/vault-plugin-secrets-proxmox/main.go"
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - name: Update pinned direct dependencies
        run: |
          go mod edit -module github.com/msmith741/vault-plugin-secrets-proxmox
          go mod edit -go=1.26.2
          go get github.com/hashicorp/vault/sdk@v0.26.0 github.com/hashicorp/vault/api@v1.23.0 github.com/Telmate/proxmox-api-go@06d3c5a3ac83d33bdf851ade987d4852b3b2cc75 github.com/hashicorp/go-hclog@v1.6.3 github.com/google/uuid@v1.6.0 github.com/stretchr/testify@v1.12.1
          go mod tidy
          go mod verify
      - name: Emit dependency lock files for reviewed commit
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path, tag in [("go.mod", "GOMOD"), ("go.sum", "GOSUM")]:
              value = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              print(f"DEPENDENCY_{tag}_BEGIN:{value}:DEPENDENCY_{tag}_END", flush=True)
          PY
      - name: Compile and run tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
