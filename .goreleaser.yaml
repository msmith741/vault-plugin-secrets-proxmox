version: 2
before:
  hooks:
    - go mod verify
    - go test ./...
builds:
  - id: vault-plugin-secrets-proxmox
    main: ./cmd/vault-plugin-secrets-proxmox
    binary: vault-plugin-secrets-proxmox
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
archives:
  - formats: ["binary"]
    name_template: >-
      {{ .ProjectName }}_{{ title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
checksum:
  name_template: '{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS'
  algorithm: sha256
changelog:
  disable: true
